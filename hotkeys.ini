; ============================================================
;  WinHotKey-AHK 默认配置模板 (首次运行自动生成)
;  每个 [小节] 定义一条快捷键; 支持整行注释(; 或 # 开头)。
;  修改保存后: 托盘图标右键 -> “重载配置”, 立即生效。
;  字段/语法详细说明见同目录 README.md。
; ============================================================


[快捷键总览]
hotkey = Ctrl+Alt+H
action = overview
desc = 弹出已设置快捷键列表


[最小化当前窗口]
hotkey = Win+Ctrl+M
action = window
target = minimize
desc = 最小化当前活动窗口

[启动并唤起 Chrome]
hotkey = Alt+C
action = app
target = chrome.exe
title = ahk_exe chrome.exe
desc = 启动 / 唤起 Chrome


;============================示例=================================

;[示例-启动记事本]
;hotkey = Win+Ctrl+B
;action = run
;target = notepad.exe
;desc = 启动记事本

;[示例-打开网址]
;hotkey = Win+Ctrl+D
;action = open
;target = https://www.autohotkey.com
;desc = 用默认浏览器打开网址

;[示例-打开文件夹]
;hotkey = Win+Ctrl+E
;action = folder
;target = C:\Users\Public
;desc = 打开文件夹

;[示例-输入文本]
;hotkey = Win+Ctrl+U
;action = type
;target = WinHotKey-AHK by AutoHotkey v2
;desc = 输入一段示例文本

;[示例-记事本窗口置顶]
;hotkey = Win+Ctrl+T
;action = window
;target = topmost
;title = ahk_exe notepad.exe
;desc = 切换记事本窗口置顶

